name: Unzip project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          python3 -m zipfile -e project.zip extracted
          rm project.zip

          shopt -s dotglob
          items=(extracted/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Extract project files"
          git push
